# Slack app for Counter. api.slack.com/apps → Create New App → From an app manifest → paste this.
# Then: Install to workspace → Bot User OAuth Token (xoxb-) → SLACK_BOT_TOKEN
#       Basic Information → App-Level Tokens → generate with connections:write → SLACK_APP_TOKEN
#       Create #counter-approvals, /invite @Counter, put the channel ID in SLACK_CHANNEL
# All three go in ~/.config/counter/.env
display_information:
  name: Counter · ArmorIQ
  description: Approvals for the Counter front desk. Holds and blocks come from ArmorIQ.
  background_color: "#1b2a4a"
features:
  bot_user:
    display_name: Counter
    always_online: true
oauth_config:
  scopes:
    bot:
      - chat:write
      - files:write
      - channels:read
      - groups:read
      - users:read
settings:
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
