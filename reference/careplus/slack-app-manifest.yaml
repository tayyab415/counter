# Slack app manifest for the CarePlus exception console.
# api.slack.com/apps → Create New App → From an app manifest → paste this.
# Then: Install to workspace → copy Bot User OAuth Token (xoxb-) → SLACK_BOT_TOKEN
#       Basic Information → App-Level Tokens → generate with connections:write → SLACK_APP_TOKEN
#       Create a private channel (e.g. #clinic-triage-demo), invite the bot, put its ID in SLACK_TRIAGE_CHANNEL
display_information:
  name: CarePlus
  description: Clinic exception console — only cases that need a human.
  background_color: "#0f766e"
features:
  bot_user:
    display_name: CarePlus
    always_online: true
  app_home:
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - channels:read
      - chat:write
      - groups:history
      - groups:read
      - groups:write
      - im:history
      - im:read
      - im:write
      - users:read
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
      - message.groups
      - message.im
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
