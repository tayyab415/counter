[project]
name = "counter-backend"
version = "0.1.0"
description = "Counter backend: shop rules, ArmorIQ gate, MCP client, pending actions, SSE"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "google-genai>=1.0",
    "armoriq-sdk==0.6.10",
    "mcp>=1.9",
    "slack-bolt>=1.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["counter_backend"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
