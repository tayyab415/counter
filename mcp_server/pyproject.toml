[project]
name = "counter-mcp"
version = "0.1.0"
description = "Counter MCP server: 11 shop tools over SQLite seed data"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.12",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["counter_mcp"]

[project.scripts]
counter-mcp = "counter_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "uvicorn>=0.32",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
